info:
  name: Create Enrollment
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:4000/api/v1/enrollments
  body:
    type: json
    data: |-
      {
        "studentId": "your-student-uuid",
        "batchId": "your-batch-uuid"
      }
  auth:
    type: bearer

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
