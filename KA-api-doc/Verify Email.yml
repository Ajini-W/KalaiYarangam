info:
  name: Verify Email
  type: http
  seq: 6

http:
  method: POST
  url: "{{base-url}}/auth/verify-email"
  body:
    type: json
    data: |-
      {
        "token": "<verification-token-from-db>"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: SUCCESS 201
    request:
      url: "{{base-url}}/auth/verify-email"
      method: POST
      body:
        type: json
        data: |-
          {
            "token": "abc123def456..."
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 201,
            "message": "Email verified successfully. You can now log in.",
            "data": null,
            "timestamp": "2026-06-20T10:00:00.000Z"
          }
  - name: ERROR 400 - Invalid token
    request:
      url: "{{base-url}}/auth/verify-email"
      method: POST
      body:
        type: json
        data: |-
          {
            "token": "invalid-token"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 400,
            "message": "Invalid or expired verification token",
            "data": null,
            "timestamp": "2026-06-20T10:00:00.000Z"
          }
  - name: ERROR 400 - Already verified
    request:
      url: "{{base-url}}/auth/verify-email"
      method: POST
      body:
        type: json
        data: |-
          {
            "token": "token-of-already-verified-user"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 400,
            "message": "Email is already verified",
            "data": null,
            "timestamp": "2026-06-20T10:00:00.000Z"
          }
