info:
  name: Login
  type: http
  seq: 4

http:
  method: POST
  url: "{{base-url}}/auth/login"
  body:
    type: json
    data: |-
      {
        "type": "email",
        "email": "kkavin0661@gmail.com",
        "password": "admin123",
        "rememberMe": false
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar('authToken', res.body.data.accessToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: SUCCESS 201
    request:
      url: "{{base-url}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "user@example.com",
            "password": "password123"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-security-policy
          value: "default-src 'self';base-uri 'self';font-src 'self' https: data:;form-action 'self';frame-ancestors 'self';img-src 'self' data:;object-src 'none';script-src 'self';script-src-attr 'none';style-src 'self' https: 'unsafe-inline';upgrade-insecure-requests"
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: http://localhost:3000
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 201,
            "message": "Login successful",
            "data": {
              "user": {
                "id": "uuid",
                "tenantId": "uuid",
                "branchId": null,
                "email": "user@example.com",
                "name": "John Doe",
                "role": "OWNER"
              },
              "accessToken": "eyJhbGciOiJIUzI1NiIs...",
              "emailVerified": true
            },
            "timestamp": "2026-06-20T10:00:00.000Z"
          }
  - name: ERROR 401 - Wrong credentials
    request:
      url: "{{base-url}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "wrong@example.com",
            "password": "wrongpassword"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 401,
            "message": "Invalid credentials",
            "data": null,
            "timestamp": "2026-06-20T10:00:00.000Z"
          }
  - name: SUCCESS - Email not verified (PENDING)
    request:
      url: "{{base-url}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "unverified@example.com",
            "password": "password123"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 201,
            "message": "Login successful",
            "data": {
              "user": {
                "id": "uuid",
                "tenantId": "uuid",
                "branchId": null,
                "email": "unverified@example.com",
                "name": "John Doe",
                "role": "OWNER"
              },
              "accessToken": "eyJhbGciOiJIUzI1NiIs...",
              "emailVerified": false
            },
            "timestamp": "2026-06-20T10:00:00.000Z"
          }
