info:
  name: Auth - Login
  type: http
  seq: 4

http:
  method: POST
  url: "{{base-url}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "kkavin0661@gmail.com",
        "password": "demo@123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: SUCCESS 200
    request:
      url: "{{base-url}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "you@example.com",
            "password": "yourpassword"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 200,
            "message": "Login successful",
            "data": {
              "user": {
                "id": "<user-id>",
                "tenantId": "<tenant-id>",
                "branchId": null,
                "email": "you@example.com",
                "name": "Your Name",
                "role": "OWNER"
              },
              "accessToken": "<access-token>",
              "refreshToken": "<refresh-token>"
            },
            "timestamp": ""
          }
  - name: UNAUTHORIZED 401
    request:
      url: "{{base-url}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "you@example.com",
            "password": "wrongpassword"
          }
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 401,
            "message": "Invalid credentials",
            "data": null,
            "timestamp": ""
          }
  - name: TOO MANY REQUESTS 429
    request:
      url: "{{base-url}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "you@example.com",
            "password": "yourpassword"
          }
    response:
      status: 429
      statusText: Too Many Requests
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 429,
            "message": "Too many attempts. Please try again after 1 hour.",
            "data": null,
            "timestamp": ""
          }
