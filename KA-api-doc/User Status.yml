info:
  name: User Status
  type: http
  seq: 7

http:
  method: POST
  url: "{{base-url}}/auth/user-status"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
  body:
    type: json
    data: |-
      {
        "accessToken": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6ImQ4ZjBmMTljLWU4YjItNGY5My1hMDE0LTQ2NGEzYzc2NDJiNyIsInRlbmFudElkIjoiOTJjMWVmZTUtM2IxMC00YTliLTgxNTYtMzlkZjJlZDRlMmM3IiwiYnJhbmNoSWQiOm51bGwsImVtYWlsIjoic2FuamF5b2ZmbDI0QGdtYWlsLmNvbSIsIm5hbWUiOiJKb2huIiwicm9sZSI6Ik9XTkVSIiwiaWF0IjoxNzgxOTQ3NDU4LCJleHAiOjE3ODI1NTIyNTh9.yMlUbUV3BtIGGNRwajdFX-1ViHTX8JnKdSu3ylQ0Mvc",
        "status": "ACTIVE"
      }
  auth: inherit

runtime:
  variables:
    - name: auth
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: SUCCESS 201 - Deactivate user
    request:
      url: "{{base-url}}/auth/user-status"
      method: POST
      headers:
        - name: Authorization
          value: Bearer eyJhbGciOiJIUzI1NiIs...
      body:
        type: json
        data: |-
          {
            "userId": "dc245798-a66c-4581-9456-7f064cd871ef",
            "status": "INACTIVE"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 201,
            "message": "User status updated to INACTIVE",
            "data": {
              "id": "dc245798-a66c-4581-9456-7f064cd871ef",
              "email": "staff-test@example.com",
              "name": "Staff Test",
              "role": "STAFF",
              "status": "INACTIVE"
            },
            "timestamp": "2026-06-20T10:00:00.000Z"
          }
  - name: SUCCESS 201 - Reactivate user
    request:
      url: "{{base-url}}/auth/user-status"
      method: POST
      headers:
        - name: Authorization
          value: Bearer eyJhbGciOiJIUzI1NiIs...
      body:
        type: json
        data: |-
          {
            "userId": "dc245798-a66c-4581-9456-7f064cd871ef",
            "status": "ACTIVE"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 201,
            "message": "User status updated to ACTIVE",
            "data": {
              "id": "dc245798-a66c-4581-9456-7f064cd871ef",
              "email": "staff-test@example.com",
              "name": "Staff Test",
              "role": "STAFF",
              "status": "ACTIVE"
            },
            "timestamp": "2026-06-20T10:00:00.000Z"
          }
  - name: SUCCESS 201 - Suspend user
    request:
      url: "{{base-url}}/auth/user-status"
      method: POST
      headers:
        - name: Authorization
          value: Bearer eyJhbGciOiJIUzI1NiIs...
      body:
        type: json
        data: |-
          {
            "userId": "dc245798-a66c-4581-9456-7f064cd871ef",
            "status": "SUSPENDED"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 201,
            "message": "User status updated to SUSPENDED",
            "data": {
              "id": "dc245798-a66c-4581-9456-7f064cd871ef",
              "email": "staff-test@example.com",
              "name": "Staff Test",
              "role": "STAFF",
              "status": "SUSPENDED"
            },
            "timestamp": "2026-06-20T10:00:00.000Z"
          }
  - name: ERROR 403 - Non-admin role
    request:
      url: "{{base-url}}/auth/user-status"
      method: POST
      headers:
        - name: Authorization
          value: Bearer <staff-or-trainer-jwt>
      body:
        type: json
        data: |-
          {
            "userId": "dc245798-a66c-4581-9456-7f064cd871ef",
            "status": "INACTIVE"
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 403,
            "message": "Forbidden resource",
            "data": null,
            "timestamp": "2026-06-20T10:00:00.000Z"
          }
  - name: ERROR 403 - Cross-tenant management
    request:
      url: "{{base-url}}/auth/user-status"
      method: POST
      headers:
        - name: Authorization
          value: Bearer <owner-jwt-from-other-tenant>
      body:
        type: json
        data: |-
          {
            "userId": "dc245798-a66c-4581-9456-7f064cd871ef",
            "status": "INACTIVE"
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 403,
            "message": "You can only manage users in your own tenant",
            "data": null,
            "timestamp": "2026-06-20T10:00:00.000Z"
          }
  - name: ERROR 404 - User not found
    request:
      url: "{{base-url}}/auth/user-status"
      method: POST
      headers:
        - name: Authorization
          value: Bearer eyJhbGciOiJIUzI1NiIs...
      body:
        type: json
        data: |-
          {
            "userId": "00000000-0000-0000-0000-000000000000",
            "status": "INACTIVE"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 404,
            "message": "User not found",
            "data": null,
            "timestamp": "2026-06-20T10:00:00.000Z"
          }
  - name: ERROR 401 - Unauthenticated
    request:
      url: "{{base-url}}/auth/user-status"
      method: POST
      body:
        type: json
        data: |-
          {
            "userId": "dc245798-a66c-4581-9456-7f064cd871ef",
            "status": "INACTIVE"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 401,
            "message": "Unauthorized",
            "data": null,
            "timestamp": "2026-06-20T10:00:00.000Z"
          }
