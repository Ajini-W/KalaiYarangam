info:
  name: Tenant - Create
  type: http
  seq: 7

http:
  method: POST
  url: "{{base-url}}/training/tenant"
  body:
    type: json
    data: |-
      {
        "businessName": "Demo Academy",
        "name": "Demo Owner",
        "email": "owner@demo.com",
        "phone": "9876543210",
        "industry": "TRAINING",
        "password": "Password123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: SUCCESS 201
    request:
      url: "{{base-url}}/training/tenant"
      method: POST
      body:
        type: json
        data: |-
          {
            "businessName": "Demo Academy",
            "name": "Demo Owner",
            "email": "owner@demo.com",
            "phone": "9876543210",
            "industry": "TRAINING",
            "password": "Password123!"
          }
    response:
      status: 201
      statusText: Created
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 201,
            "message": "Tenant created successfully",
            "data": {
              "id": "<tenant-id>",
              "name": "Demo Academy",
              "slug": "demo-academy"
            },
            "timestamp": ""
          }
  - name: CONFLICT 409
    request:
      url: "{{base-url}}/training/tenant"
      method: POST
      body:
        type: json
        data: |-
          {
            "businessName": "Demo Academy",
            "name": "Demo Owner",
            "email": "owner@demo.com",
            "phone": "9876543210",
            "industry": "TRAINING",
            "password": "Password123!"
          }
    response:
      status: 409
      statusText: Conflict
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 409,
            "message": "Business name is already registered",
            "data": null,
            "timestamp": ""
          }
