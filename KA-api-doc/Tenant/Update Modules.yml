info:
  name: Update Modules
  type: http
  seq: 14

http:
  method: PATCH
  url: "{{base-url}}/training/modules"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "trainingManagement": true,
        "rentalManagement": false,
        "eventManagement": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: SUCCESS 200
    request:
      url: "{{base-url}}/training/modules"
      method: PATCH
      headers:
        - name: Authorization
          value: Bearer <access-token>
      body:
        type: json
        data: |-
          {
            "trainingManagement": true,
            "rentalManagement": false,
            "eventManagement": true
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 200,
            "message": "Modules updated successfully",
            "data": {
              "trainingManagement": true,
              "rentalManagement": false,
              "eventManagement": true
            },
            "timestamp": ""
          }
  - name: UNAUTHORIZED 401
    request:
      url: "{{base-url}}/training/modules"
      method: PATCH
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 401,
            "message": "Unauthorized",
            "data": null,
            "timestamp": ""
          }
