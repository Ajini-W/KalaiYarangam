info:
  name: Complete Onboarding
  type: http
  seq: 15

http:
  method: POST
  url: "{{base-url}}/training/onboarding"
  body:
    type: json
    data: |-
      {
        "name": "Kalai arangam",
        "email": "kalaiarangam@gmail.com",
        "phone": "8838121130",
        "businessName": "kalai Academy",
        "industry": "TRAINING",
        "password": "Password123!"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: if (res.body.data) { bru.setVar('onboardingToken', res.body.data.token.accessToken); }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: SUCCESS 201
    request:
      url: "{{base-url}}/training/onboarding"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Onboarded Owner",
            "email": "onboarded@demo.com",
            "phone": "9876543299",
            "businessName": "Onboarded Academy",
            "industry": "TRAINING",
            "password": "Password123!"
          }
    response:
      status: 201
      statusText: Created
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 201,
            "message": "Onboarding completed successfully",
            "data": {
              "token": {
                "accessToken": "<jwt-token>",
                "user": {
                  "id": "<user-id>",
                  "tenantId": "<tenant-id>",
                  "branchId": null,
                  "email": "onboarded@demo.com",
                  "name": "Onboarded Owner",
                  "role": "OWNER"
                }
              },
              "tenant": {
                "id": "<tenant-id>",
                "name": "Onboarded Academy",
                "slug": "onboarded-academy",
                "industry": "TRAINING"
              },
              "branch": {
                "id": "<branch-id>",
                "name": "Main Branch",
                "isDefault": true
              },
              "settings": {
                "timezone": "Asia/Kolkata",
                "dateFormat": "DD/MM/YYYY",
                "currency": "INR",
                "language": "en",
                "timeFormat": "12h",
                "weekStartDay": "monday"
              },
              "modules": {
                "trainingManagement": true,
                "rentalManagement": false,
                "eventManagement": false
              }
            },
            "timestamp": ""
          }
  - name: CONFLICT 409
    request:
      url: "{{base-url}}/training/onboarding"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Onboarded Owner",
            "email": "onboarded@demo.com",
            "phone": "9876543299",
            "businessName": "Onboarded Academy",
            "industry": "TRAINING",
            "password": "Password123!"
          }
    response:
      status: 409
      statusText: Conflict
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 409,
            "message": "Business name is already registered",
            "data": null,
            "timestamp": ""
          }
