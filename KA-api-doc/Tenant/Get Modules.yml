info:
  name: Get Modules
  type: http
  seq: 13

http:
  method: GET
  url: "{{base-url}}/training/modules"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: SUCCESS 200
    request:
      url: "{{base-url}}/training/modules"
      method: GET
      headers:
        - name: Authorization
          value: Bearer <access-token>
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 200,
            "message": "Modules retrieved successfully",
            "data": {
              "trainingManagement": false,
              "rentalManagement": false,
              "eventManagement": false
            },
            "timestamp": ""
          }
  - name: UNAUTHORIZED 401
    request:
      url: "{{base-url}}/training/modules"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 401,
            "message": "Unauthorized",
            "data": null,
            "timestamp": ""
          }
