info:
  name: Get Branding
  type: http
  seq: 11

http:
  method: GET
  url: "{{base-url}}/training/branding"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: SUCCESS 200
    request:
      url: "{{base-url}}/training/branding"
      method: GET
      headers:
        - name: Authorization
          value: Bearer <access-token>
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 200,
            "message": "Branding retrieved successfully",
            "data": {
              "logoUrl": null,
              "faviconUrl": null,
              "primaryColor": null,
              "secondaryColor": null,
              "tagline": null,
              "customDomain": null
            },
            "timestamp": ""
          }
  - name: UNAUTHORIZED 401
    request:
      url: "{{base-url}}/training/branding"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 401,
            "message": "Unauthorized",
            "data": null,
            "timestamp": ""
          }
