info:
  name: Update Tenant
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{base-url}}/training/tenant"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "name": "Demo Academy Updated",
        "phone": "9876543210",
        "email": "owner@demo.com",
        "website": "https://demoacademy.com",
        "logoUrl": "https://demoacademy.com/logo.png"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: SUCCESS 200
    request:
      url: "{{base-url}}/training/tenant"
      method: PATCH
      headers:
        - name: Authorization
          value: Bearer <access-token>
      body:
        type: json
        data: |-
          {
            "name": "Demo Academy Updated",
            "phone": "9876543210",
            "email": "owner@demo.com",
            "website": "https://demoacademy.com",
            "logoUrl": "https://demoacademy.com/logo.png"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 200,
            "message": "Tenant updated successfully",
            "data": {
              "id": "<tenant-id>",
              "name": "Demo Academy Updated",
              "slug": "demo-academy",
              "industry": "TRAINING",
              "status": "TRIAL",
              "logoUrl": "https://demoacademy.com/logo.png",
              "website": "https://demoacademy.com",
              "phone": "9876543210",
              "email": "owner@demo.com",
              "createdAt": "",
              "updatedAt": ""
            },
            "timestamp": ""
          }
  - name: UNAUTHORIZED 401
    request:
      url: "{{base-url}}/training/tenant"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "name": "Demo Academy Updated"
          }
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 401,
            "message": "Unauthorized",
            "data": null,
            "timestamp": ""
          }
