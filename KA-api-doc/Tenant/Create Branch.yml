info:
  name: Create Branch
  type: http
  seq: 4

http:
  method: POST
  url: "{{base-url}}/training/branches"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "name": "ghama Branch",
        "code": "DT-001",
        "address": "123 Main Street",
        "city": "Chennai",
        "state": "Tamil Nadu",
        "pincode": "600001",
        "phone": "9787217678",
        "email": "alpha@gmail.com"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: if (res.body.data) { bru.setVar('branchId', res.body.data.id); }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: SUCCESS 201
    request:
      url: "{{base-url}}/training/branches"
      method: POST
      headers:
        - name: Authorization
          value: Bearer <access-token>
      body:
        type: json
        data: |-
          {
            "name": "Downtown Branch",
            "code": "DT-001",
            "address": "123 Main Street",
            "city": "Chennai",
            "state": "Tamil Nadu",
            "pincode": "600001",
            "phone": "9876543210",
            "email": "downtown@branch.com"
          }
    response:
      status: 201
      statusText: Created
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 201,
            "message": "Branch created successfully",
            "data": {
              "id": "<branch-id>",
              "tenantId": "<tenant-id>",
              "name": "Downtown Branch",
              "code": "DT-001",
              "address": "123 Main Street",
              "city": "Chennai",
              "state": "Tamil Nadu",
              "pincode": "600001",
              "phone": "9876543210",
              "email": "downtown@branch.com",
              "isDefault": false,
              "isActive": true,
              "createdAt": "",
              "updatedAt": ""
            },
            "timestamp": ""
          }
  - name: UNAUTHORIZED 401
    request:
      url: "{{base-url}}/training/branches"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Downtown Branch"
          }
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 401,
            "message": "Unauthorized",
            "data": null,
            "timestamp": ""
          }
