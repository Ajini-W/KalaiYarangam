info:
  name: Register
  type: http
  seq: 5

http:
  method: POST
  url: "{{base-url}}/auth/register"
  headers:
    - name: Authorization
      value: "{{auth}}"
  body:
    type: json
    data: |-
      {
        "name": "david",
        "email": "kkavin0661@gmail.com",
        "phone": "8645972153",
        "businessName": "My carrer",
        "industry": "RENTAL",
        "password": "demo@123"
      }
  auth: inherit

runtime:
  variables:
    - name: auth
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: SUCCESS 201
    request:
      url: "{{base-url}}/auth/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "John Doe",
            "email": "user@example.com",
            "phone": "9876543210",
            "businessName": "My Business",
            "industry": "TRAINING",
            "password": "password123"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: content-security-policy
          value: "default-src 'self';base-uri 'self';font-src 'self' https: data:;form-action 'self';frame-ancestors 'self';img-src 'self' data:;object-src 'none';script-src 'self';script-src-attr 'none';style-src 'self' https: 'unsafe-inline';upgrade-insecure-requests"
        - name: content-type
          value: application/json; charset=utf-8
        - name: access-control-allow-origin
          value: http://localhost:3000
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 201,
            "message": "Registration successful",
            "data": {
              "user": {
                "id": "uuid",
                "tenantId": "uuid",
                "branchId": null,
                "email": "user@example.com",
                "name": "John Doe",
                "role": "OWNER"
              },
              "accessToken": "eyJhbGciOiJIUzI1NiIs..."
