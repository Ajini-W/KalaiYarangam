info:
  name: Tenant - Get
  type: http
  seq: 8

http:
  method: GET
  url: "{{base-url}}/training/tenant"
  body:
    type: json
  auth:
    type: bearer
    bearer:
      token: "<access-token>"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: SUCCESS 200
    request:
      url: "{{base-url}}/training/tenant"
      method: GET
      headers:
        - name: Authorization
          value: "Bearer <access-token>"
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 200,
            "message": "Tenant retrieved successfully",
            "data": {
              "id": "<tenant-id>",
              "name": "Demo Academy",
              "slug": "demo-academy",
              "industry": "TRAINING",
              "status": "TRIAL",
              "logoUrl": null,
              "website": null,
              "phone": null,
              "email": null,
              "createdAt": "",
              "updatedAt": ""
            },
            "timestamp": ""
          }
  - name: UNAUTHORIZED 401
    request:
      url: "{{base-url}}/training/tenant"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: json
        data: |-
          {
            "httpStatusCode": 401,
            "message": "Unauthorized",
            "data": null,
            "timestamp": ""
          }
